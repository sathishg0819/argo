apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: d1
  namespace: hema
spec:
  replicas: 2
  revisionHistoryLimit: 3

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: cont1
        image: httpd:latest
        ports:
        - containerPort: 80

  strategy:
    canary:
      steps:
      - setWeight: 20
      - pause:
          duration: 3s

      - setWeight: 50
      - pause:
          duration: 3s

      - setWeight: 100
